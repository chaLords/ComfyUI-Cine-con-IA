name: Release

# Al subir un tag vX.Y.Z se publica su Release con la seccion de esa
# version en CHANGELOG.md y CHANGELOG_ES.md.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check that pyproject matches the tag
        shell: bash
        run: |
          version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "pyproject.toml says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build release notes
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
