name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      # Sin token no se publica, y eso tiene que verse. Antes este paso se
      # saltaba la publicacion y el job terminaba en verde: el resultado era
      # que cada version parecia publicarse mientras el registro seguia sin
      # conocer el paquete. Un workflow de publicacion que no publica ha
      # fallado, y asi se reporta.
      - name: Check registry token
        shell: bash
        run: |
          if [ -n "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "Registry token found."
            exit 0
          fi
          {
            echo "### Comfy Registry publication did not run"
            echo ""
            echo "The \`REGISTRY_ACCESS_TOKEN\` secret is not configured, so the"
            echo "package was **not** published and the registry still does not"
            echo "know about this version."
            echo ""
            echo "Create a Personal Access Token at <https://registry.comfy.org>"
            echo "and add it under **Settings -> Secrets and variables -> Actions**"
            echo "as \`REGISTRY_ACCESS_TOKEN\`, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Missing REGISTRY_ACCESS_TOKEN::Nothing was published to Comfy Registry."
          exit 1

      - name: Check out code
        uses: actions/checkout@v7

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

